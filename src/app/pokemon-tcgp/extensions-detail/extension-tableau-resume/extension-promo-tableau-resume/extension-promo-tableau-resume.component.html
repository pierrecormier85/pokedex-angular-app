<table mat-table [dataSource]="promoDetail" class="mat-elevation-z8">
  <ng-container matColumnDef="pack">
    <th mat-header-cell *matHeaderCellDef> Pack </th>
    <td mat-cell *matCellDef="let element"> Promo </td>
  </ng-container>

  <ng-container matColumnDef="promo">
    <th mat-header-cell *matHeaderCellDef> Promo </th>
    <td mat-cell *matCellDef="let element"> {{element}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
